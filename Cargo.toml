[package]
name = "phonemouse"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "PhoneMouse"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
enigo = "0.6.1"
local-ip-address = "0.6.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
