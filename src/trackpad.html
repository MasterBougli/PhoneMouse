<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PhoneMouse</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12110f;
      --ink: #f4efe6;
      --muted: #a39886;
      --line: #3c3428;
      --pad: #1e1b16;
      --accent: #f0a202;
      --accent-ink: #241803;
      --ok: #8fce7a;
      --danger: #e15a3a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      display: flex;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    #app {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header strong {
      font-size: 18px;
      letter-spacing: 0.01em;
    }

    #status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    #status i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      display: block;
    }

    #status.ok { color: var(--ok); }
    #status.ok i { background: var(--ok); }
    #status.bad { color: var(--danger); }
    #status.bad i { background: var(--danger); }

    .speed {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    #pad {
      flex: 1;
      min-height: 0;
      position: relative;
      border-radius: 22px;
      border: 1px solid var(--line);
      background:
        radial-gradient(160px 160px at var(--fx, 50%) var(--fy, 40%), rgba(240, 162, 2, 0.18), transparent 70%),
        var(--pad);
      touch-action: none;
      overflow: hidden;
    }

    #pad.dragging {
      border-color: var(--accent);
    }

    #hint {
      position: absolute;
      inset: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      padding: 24px;
      pointer-events: none;
    }

    #pad.used #hint { opacity: 0; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: #2a251e;
      color: var(--ink);
      border-radius: 14px;
      min-height: 52px;
      font: inherit;
      font-size: 15px;
    }

    button:active { transform: translateY(1px); }

    #hold.on {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    #gate {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 2;
    }

    #gate[hidden] { display: none; }

    form {
      width: min(360px, 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 650;
    }

    p { margin: 0; color: var(--muted); }

    #pin {
      width: 100%;
      background: #1e1b16;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 14px;
      font: 600 32px/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.4em;
      text-align: center;
      padding: 16px 12px 16px 22px;
      touch-action: manipulation;
    }

    #pin:focus { outline: 2px solid var(--accent); border-color: transparent; }

    #connect {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      font-weight: 650;
    }

    #pin-error { min-height: 1.4em; color: var(--danger); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <strong>PhoneMouse</strong>
      <span id="status"><i></i><span id="status-text">hors ligne</span></span>
    </header>
    <label class="speed">Vitesse
      <input id="speed" type="range" min="0.4" max="2.8" step="0.1" value="1.3">
      <span id="speed-value">1.3</span>
    </label>
    <div id="pad">
      <p id="hint">Un doigt déplace le curseur.<br>Une tape clique. Deux doigts défilent.<br>Un appui long maintient le clic.</p>
    </div>
    <div class="actions">
      <button id="left" type="button">Clic</button>
      <button id="right" type="button">Droit</button>
      <button id="hold" type="button" aria-pressed="false">Tenir</button>
    </div>
  </div>

  <div id="gate">
    <form id="pin-form">
      <h1>PhoneMouse</h1>
      <p>Entre le code à 4 chiffres affiché dans la fenêtre du PC.</p>
      <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]*" enterkeyhint="go" aria-label="Code à 4 chiffres">
      <button id="connect" type="submit">Connecter</button>
      <p id="pin-error" role="alert"></p>
    </form>
  </div>

  <script>
    const pad = document.getElementById("pad");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("status-text");
    const gate = document.getElementById("gate");
    const pinInput = document.getElementById("pin");
    const pinError = document.getElementById("pin-error");
    const speedInput = document.getElementById("speed");
    const speedValue = document.getElementById("speed-value");
    const holdBtn = document.getElementById("hold");

    const PIN_KEY = "phonemouse-pin";
    const SPEED_KEY = "phonemouse-speed";
    const TAP_DISTANCE = 16;
    const TAP_MS = 300;
    const LONG_PRESS_MS = 420;

    let sensitivity = Number(localStorage.getItem(SPEED_KEY)) || 1.3;
    speedInput.value = String(sensitivity);
    speedValue.textContent = sensitivity.toFixed(1);

    let socket = null;
    let authed = false;
    let shouldReconnect = true;
    let retry = 0;
    let pendingPin = localStorage.getItem(PIN_KEY) || "";
    let reconnectTimer = 0;

    const pointers = new Map();
    let gesture = "none";
    let gestureStart = 0;
    let maxMoved = 0;
    let lastCentroid = null;
    let scrollX = 0;
    let scrollY = 0;
    let longTimer = 0;
    let latched = false;
    let pressing = false;
    let leftDown = false;
    let pendingX = 0;
    let pendingY = 0;
    let moveScheduled = false;

    function setStatus(text, kind) {
      statusText.textContent = text;
      statusEl.classList.remove("ok", "bad");
      if (kind) statusEl.classList.add(kind);
    }

    function send(payload) {
      if (!socket || socket.readyState !== WebSocket.OPEN || !authed) return;
      socket.send(JSON.stringify(payload));
    }

    function scale() {
      return sensitivity * (window.devicePixelRatio || 1);
    }

    function queueMove(dx, dy) {
      const factor = scale();
      pendingX += dx * factor;
      pendingY += dy * factor;
      if (!moveScheduled) {
        moveScheduled = true;
        requestAnimationFrame(flushMove);
      }
    }

    function flushMove() {
      moveScheduled = false;
      if (!pendingX && !pendingY) return;
      send({ op: "move", x: pendingX, y: pendingY });
      pendingX = 0;
      pendingY = 0;
      pad.classList.add("used");
    }

    function queueScroll(dx, dy) {
      const step = 34 / Math.max(sensitivity, 0.4);
      scrollX += dx;
      scrollY += dy;
      let notchesX = 0;
      let notchesY = 0;
      while (scrollY >= step) { notchesY += 1; scrollY -= step; }
      while (scrollY <= -step) { notchesY -= 1; scrollY += step; }
      while (scrollX >= step) { notchesX += 1; scrollX -= step; }
      while (scrollX <= -step) { notchesX -= 1; scrollX += step; }
      notchesX = Math.max(-8, Math.min(8, notchesX));
      notchesY = Math.max(-8, Math.min(8, notchesY));
      if (notchesX || notchesY) {
        send({ op: "scroll", x: notchesX, y: notchesY });
        pad.classList.add("used");
      }
    }

    function syncLeftButton() {
      const want = latched || pressing;
      if (want === leftDown) {
        holdBtn.classList.toggle("on", latched);
        holdBtn.setAttribute("aria-pressed", latched ? "true" : "false");
        pad.classList.toggle("dragging", want);
        return;
      }
      leftDown = want;
      send(want ? { op: "down", btn: "left" } : { op: "up", btn: "left" });
      holdBtn.classList.toggle("on", latched);
      holdBtn.setAttribute("aria-pressed", latched ? "true" : "false");
      pad.classList.toggle("dragging", want);
    }

    function resetGesture() {
      pointers.clear();
      gesture = "none";
      pressing = false;
      lastCentroid = null;
      clearTimeout(longTimer);
      syncLeftButton();
    }

    function centroid() {
      let x = 0;
      let y = 0;
      for (const point of pointers.values()) {
        x += point.x;
        y += point.y;
      }
      return { x: x / pointers.size, y: y / pointers.size };
    }

    function placeFinger(clientX, clientY) {
      const rect = pad.getBoundingClientRect();
      pad.style.setProperty("--fx", (clientX - rect.left) + "px");
      pad.style.setProperty("--fy", (clientY - rect.top) + "px");
    }

    pad.addEventListener("pointerdown", (event) => {
      pad.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY, moved: 0 });
      placeFinger(event.clientX, event.clientY);
      if (pointers.size === 1) {
        gesture = "move";
        gestureStart = performance.now();
        maxMoved = 0;
        clearTimeout(longTimer);
        longTimer = setTimeout(() => {
          if (pointers.size === 1 && maxMoved < 12 && gesture === "move") {
            gesture = "drag";
            pressing = true;
            syncLeftButton();
            navigator.vibrate?.(15);
          }
        }, LONG_PRESS_MS);
      } else if (pointers.size >= 2) {
        clearTimeout(longTimer);
        if (pressing) {
          pressing = false;
          syncLeftButton();
        }
        gesture = "scroll";
        maxMoved = 0;
        for (const point of pointers.values()) point.moved = 0;
        lastCentroid = centroid();
      }
      event.preventDefault();
    });

    pad.addEventListener("pointermove", (event) => {
      const point = pointers.get(event.pointerId);
      if (!point) return;
      const dx = event.clientX - point.x;
      const dy = event.clientY - point.y;
      point.x = event.clientX;
      point.y = event.clientY;
      point.moved += Math.hypot(dx, dy);
      maxMoved = Math.max(maxMoved, point.moved);
      if (maxMoved > 12) clearTimeout(longTimer);
      placeFinger(event.clientX, event.clientY);

      if (pointers.size === 1 && (gesture === "move" || gesture === "drag")) {
        queueMove(dx, dy);
      } else if (gesture === "scroll" && pointers.size >= 2 && lastCentroid) {
        const next = centroid();
        queueScroll(next.x - lastCentroid.x, next.y - lastCentroid.y);
        lastCentroid = next;
      }
      event.preventDefault();
    });

    function endPointer(event) {
      if (!pointers.has(event.pointerId)) return;
      pointers.delete(event.pointerId);
      if (pointers.size === 0) {
        clearTimeout(longTimer);
        const tap = maxMoved < TAP_DISTANCE && performance.now() - gestureStart < TAP_MS;
        const wasScroll = gesture === "scroll";
        const wasMove = gesture === "move";
        if (pressing) {
          pressing = false;
          syncLeftButton();
        } else if (wasScroll && tap) {
          send({ op: "click", btn: "right" });
          navigator.vibrate?.(12);
        } else if (wasMove && tap && !latched) {
          send({ op: "click", btn: "left" });
          navigator.vibrate?.(8);
        }
        gesture = "none";
        lastCentroid = null;
      } else if (gesture === "scroll") {
        gesture = "settle";
        lastCentroid = null;
      }
    }

    pad.addEventListener("pointerup", endPointer);
    pad.addEventListener("pointercancel", endPointer);
    pad.addEventListener("contextmenu", (event) => event.preventDefault());

    document.getElementById("left").addEventListener("click", () => {
      send({ op: "click", btn: "left" });
      navigator.vibrate?.(8);
    });
    document.getElementById("right").addEventListener("click", () => {
      send({ op: "click", btn: "right" });
      navigator.vibrate?.(8);
    });
    holdBtn.addEventListener("click", () => {
      latched = !latched;
      syncLeftButton();
      navigator.vibrate?.(10);
    });

    speedInput.addEventListener("input", () => {
      sensitivity = Number(speedInput.value);
      speedValue.textContent = sensitivity.toFixed(1);
      localStorage.setItem(SPEED_KEY, String(sensitivity));
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        latched = false;
        resetGesture();
      }
    });

    function showGate(message) {
      gate.hidden = false;
      pinError.textContent = message || "";
      pinInput.focus();
    }

    function connect() {
      clearTimeout(reconnectTimer);
      if (socket) {
        socket.onclose = null;
        socket.close();
      }
      authed = false;
      setStatus("connexion…");
      const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
      const ws = new WebSocket(url);
      socket = ws;

      ws.onopen = () => {
        retry = 0;
        ws.send(JSON.stringify({ op: "auth", pin: pendingPin }));
      };

      ws.onmessage = (event) => {
        let message;
        try { message = JSON.parse(event.data); } catch { return; }
        if (message.ok === true) {
          authed = true;
          localStorage.setItem(PIN_KEY, pendingPin);
          gate.hidden = true;
          pinError.textContent = "";
          setStatus("relié", "ok");
          if (navigator.wakeLock) {
            navigator.wakeLock.request("screen").catch(() => {});
          }
          return;
        }
        if (message.ok === false) {
          authed = false;
          shouldReconnect = false;
          localStorage.removeItem(PIN_KEY);
          pendingPin = "";
          const wait = Number(message.retry) || 0;
          const text = wait
            ? "Trop d'essais. Réessaie dans " + Math.ceil(wait / 60) + " min."
            : "Code refusé.";
          showGate(text);
          setStatus("refusé", "bad");
        }
      };

      ws.onclose = () => {
        if (socket !== ws) return;
        authed = false;
        latched = false;
        leftDown = false;
        pressing = false;
        holdBtn.classList.remove("on");
        pad.classList.remove("dragging");
        setStatus("hors ligne", "bad");
        if (shouldReconnect && pendingPin) {
          const wait = Math.min(5000, 400 * 2 ** retry);
          retry += 1;
          reconnectTimer = setTimeout(connect, wait);
        }
      };
    }

    document.getElementById("pin-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const pin = pinInput.value.trim();
      if (!/^\d{4}$/.test(pin)) {
        pinError.textContent = "Entre les 4 chiffres.";
        return;
      }
      pendingPin = pin;
      shouldReconnect = true;
      pinError.textContent = "";
      connect();
    });

    setInterval(() => send({ op: "ping" }), 15000);

    if (pendingPin) {
      gate.hidden = true;
      connect();
    } else {
      showGate("");
    }
  </script>
</body>
</html>
